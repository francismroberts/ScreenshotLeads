ng>Create<\/strong><\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t3f\"><span>Bookmark the sheet so it’s easy to find<\/span><\/label><\/li>\n    <\/ul>\n  <\/section>\n\n  <section class=\"cl-step\" aria-labelledby=\"cl-s4\">\n    <h2 id=\"cl-s4\"><span class=\"cl-label\">Step 4 · <span class=\"cl-ios\">On your iPhone<\/span><span class=\"cl-mac\">On your Mac<\/span><\/span> Choose how to trigger it<\/h2>\n    <p class=\"cl-why\">Triggering the shortcut is what runs it. It’s the same shortcut on iPhone and Mac. Only the trigger is different. Pick one.<\/p>\n\n    <div class=\"cl-pair cl-ios\">\n      <div class=\"cl-card\">\n        <h3>Action Button<\/h3>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-t4a\"><span>Open <span class=\"cl-path\">Settings › Action Button<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4b\"><span>Swipe to <strong>Shortcut<\/strong><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4c\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"cl-card\">\n        <h3>Back Tap<\/h3>\n        <p class=\"cl-muted\">If your Action Button already does something else.<\/p>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-t4d\"><span>Open <span class=\"cl-path\">Settings › Accessibility › Touch › Back Tap<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4e\"><span>Choose <strong>Double Tap<\/strong> or <strong>Triple Tap<\/strong><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4f\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"cl-pair cl-mac\">\n      <div class=\"cl-card\">\n        <h3>Keyboard shortcut<\/h3>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-t4g\"><span>In the Shortcuts app, double-click your Leads shortcut<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4h\"><span>Click the details button (ⓘ)<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4i\"><span>Click <strong>Add Keyboard Shortcut<\/strong><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4j\"><span>Press a key combination you don’t use for anything else<\/span><\/label><\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"cl-card\">\n        <h3>Spotlight<\/h3>\n        <p class=\"cl-muted\">No setup needed. Each time, press <strong>⌘ Space<\/strong>, type your shortcut’s name, and press <strong>Return<\/strong>.<\/p>\n      <\/div>\n    <\/div>\n\n    <p class=\"cl-note\">Using both an iPhone and a Mac? Set up a trigger on each. With iCloud Sync on, they run the same shortcut and save to the same lead tracker.<\/p>\n  <\/section>\n\n  <section class=\"cl-step\" aria-labelledby=\"cl-s5\">\n    <h2 id=\"cl-s5\"><span class=\"cl-label\">Step 5 · Test it<\/span> Save your first creator<\/h2>\n    <ul class=\"cl-tasks\">\n      <li><label><input type=\"checkbox\" id=\"cl-t5a\"><span>Open a creator’s main profile page (not a video or post)<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5b\"><span>Trigger the shortcut<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5c\"><span>First time only: choose <strong>Always Allow<\/strong> on each pop-up<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5d\"><span>Look for <strong>Saved: [name] ([platform])<\/strong><\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5e\"><span>Open your lead tracker and find the new row<\/span><\/label><\/li>\n    <\/ul>\n    <p class=\"cl-muted cl-small\">One pop-up asks to send images to docs.google.com. That’s how the details reach your form.<\/p>\n  <\/section>\n\n  <section aria-labelledby=\"cl-msgs\">\n    <h2 id=\"cl-msgs\">Messages you’ll see<\/h2>\n    <ul class=\"cl-rows\">\n      <li>\n        <div class=\"cl-msg\">Saved: <em>[name]<\/em> (<em>[platform]<\/em>)<\/div>\n        <p>It worked. The creator is in your lead tracker.<\/p>\n      <\/li>\n      <li>\n        <div class=\"cl-msg\">Couldn’t read a profile here.<\/div>\n        <p>Nothing was saved. Open their main profile page and try again.<\/p>\n      <\/li>\n      <li>\n        <div class=\"cl-msg\">Not saved.<\/div>\n        <p>Your form didn’t accept it. Check that the form is published (Step 1). Still failing? Delete the shortcut and redo Step 2.<\/p>\n      <\/li>\n    <\/ul>\n  <\/section>\n\n  <section aria-labelledby=\"cl-trouble\">\n    <h2 id=\"cl-trouble\">Troubleshooting<\/h2>\n    <ul class=\"cl-rows\">\n      <li>\n        <span class=\"cl-issue\">Saved, but some details are wrong<\/span>\n        <p>Use the main profile page, with the follower count showing.<\/p>\n      <\/li>\n      <li>\n        <span class=\"cl-issue\">Can’t make a copy of the form<\/span>\n        <p>Sign in to Google, then open the link again.<\/p>\n      <\/li>\n      <li>\n        <span class=\"cl-issue\">No Apple Intelligence in Settings<\/span>\n        <p>Check that your device is supported (see You’ll need) and that your device language and Siri language match.<\/p>\n      <\/li>\n    <\/ul>\n  <\/section>\n\n  <section aria-labelledby=\"cl-know\">\n    <h2 id=\"cl-know\">Good to know<\/h2>\n    <ul class=\"cl-bullets\">\n      <li>It reads only what’s on screen, and AI can misread. Double-check key details.<\/li>\n      <li>Long bio links can get cut off. The profile link has the full bio.<\/li>\n      <li>Each trigger adds a new row, so triggering twice saves the creator twice.<\/li>\n      <li>Your screenshot goes to the AI you picked. The details go to your own form.<\/li>\n    <\/ul>\n  <\/section>\n\n<\/div>\n<\/div>"}, {"v": 12, "name": "Monochrome", "desc": "Black and white, new title, second-device setup", "css": "\n  /* Layout: one phone-first column, all scoped under .cl so it can drop into a Squarespace code block. Monochrome ink on white; the only color is the green / yellow / red status meaning. An iPhone/Mac switch (CSS only, no JavaScript) shows the steps for your device; Step 4 opens a second-device setup in place. */\n  :host {\n    --cl-bg: #fafafa;\n    --cl-surface: #ffffff;\n    --cl-ink: #18181b;\n    --cl-muted: #63636b;\n    --cl-rule: #e4e4e7;\n    --cl-soft: #f1f1f3;\n    --cl-btn: #18181b;\n    --cl-btn-ink: #ffffff;\n    --cl-ok: #1f8a4c;\n    --cl-warn: #b7791f;\n    --cl-bad: #d1342f;\n  }\n  @media (prefers-color-scheme: dark) {\n    :host(:not([data-theme=\"light\"])) {\n      --cl-bg: #0f0f11;\n      --cl-surface: #18181b;\n      --cl-ink: #f4f4f5;\n      --cl-muted: #a1a1aa;\n      --cl-rule: #2a2a2f;\n      --cl-soft: #232328;\n      --cl-btn: #f4f4f5;\n      --cl-btn-ink: #18181b;\n      --cl-ok: #46c37b;\n      --cl-warn: #f0b43c;\n      --cl-bad: #ff6b61;\n      color-scheme: dark;\n    }\n  }\n  :host([data-theme=\"dark\"]) {\n    --cl-bg: #0f0f11;\n    --cl-surface: #18181b;\n    --cl-ink: #f4f4f5;\n    --cl-muted: #a1a1aa;\n    --cl-rule: #2a2a2f;\n    --cl-soft: #232328;\n    --cl-btn: #f4f4f5;\n    --cl-btn-ink: #18181b;\n    --cl-ok: #46c37b;\n    --cl-warn: #f0b43c;\n    --cl-bad: #ff6b61;\n    color-scheme: dark;\n  }\n  .vh-doc { background: var(--cl-bg); color: var(--cl-ink); }\n  .cl-page { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 2.5rem 5rem; }\n\n  /* ===== Guide (portable) ===== */\n  .cl {\n    --cl-sans: \"Geist\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    --cl-mono: \"Geist Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n    font-family: var(--cl-sans);\n    font-size: 1rem;\n    line-height: 1.55;\n    color: var(--cl-ink);\n    -webkit-font-smoothing: antialiased;\n    display: grid;\n    gap: 2.75rem;\n  }\n  .cl *, .cl *::before, .cl *::after { box-sizing: border-box; }\n  .cl h1, .cl h2, .cl h3, .cl p, .cl ul, .cl ol, .cl dl, .cl dt, .cl dd, .cl fieldset, .cl legend { margin: 0; padding: 0; border: 0; }\n  .cl h1, .cl h2, .cl h3 { font-family: var(--cl-sans); color: var(--cl-ink); text-transform: none; }\n  .cl ul, .cl ol { list-style: none; }\n  .cl p, .cl li { max-width: 62ch; font-size: inherit; line-height: inherit; }\n  .cl section, .cl header { display: grid; gap: 0.9rem; min-width: 0; }\n  .cl a { color: var(--cl-ink); font-weight: 600; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }\n  .cl a:focus-visible, .cl summary:focus-visible { outline: 3px solid var(--cl-ink); outline-offset: 3px; border-radius: 6px; }\n  .cl strong, .cl .cl-path { font-weight: 600; }\n  .cl .cl-muted { color: var(--cl-muted); }\n  .cl .cl-small { font-size: 0.9rem; }\n\n  .cl .cl-label {\n    font-family: var(--cl-mono);\n    font-size: 0.72rem;\n    font-weight: 500;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--cl-muted);\n  }\n  .cl h1 { font-size: clamp(2.1rem, 7vw, 2.8rem); font-weight: 650; line-height: 1.05; letter-spacing: -0.035em; text-wrap: balance; }\n  .cl .cl-intro { font-size: 1.1rem; line-height: 1.55; }\n  .cl h2 { font-size: 1.35rem; font-weight: 620; line-height: 1.2; letter-spacing: -0.018em; text-wrap: balance; }\n  .cl h3 { font-size: 1rem; font-weight: 620; line-height: 1.3; letter-spacing: -0.01em; }\n\n  /* Flow */\n  .cl .cl-flow {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 1rem;\n    position: relative;\n  }\n  .cl .cl-flow::before {\n    content: \"\";\n    position: absolute;\n    top: 1.375rem;\n    left: 12.5%;\n    right: 12.5%;\n    height: 1px;\n    background: var(--cl-rule);\n  }\n  .cl .cl-flow li { display: grid; gap: 0.25rem; justify-items: center; text-align: center; min-width: 0; }\n  .cl .cl-ico {\n    position: relative;\n    width: 2.75rem;\n    height: 2.75rem;\n    border-radius: 50%;\n    display: grid;\n    place-items: center;\n    background: var(--cl-surface);\n    border: 1px solid var(--cl-rule);\n    color: var(--cl-ink);\n    margin-bottom: 0.4rem;\n  }\n  .cl .cl-flow li:last-child .cl-ico { background: var(--cl-btn); border-color: var(--cl-btn); color: var(--cl-btn-ink); }\n  .cl .cl-ico svg { width: 1.3rem; height: 1.3rem; }\n  .cl .cl-flow strong { font-size: 0.9rem; line-height: 1.3; }\n  .cl .cl-flow .cl-d { font-size: 0.84rem; color: var(--cl-muted); line-height: 1.35; }\n  @media (max-width: 600px) {\n    .cl .cl-flow { grid-template-columns: 1fr; gap: 1rem; }\n    .cl .cl-flow::before { top: 1.375rem; bottom: 1.375rem; left: 1.375rem; right: auto; width: 1px; height: auto; }\n    .cl .cl-flow li { grid-template-columns: 2.75rem 1fr; column-gap: 0.9rem; row-gap: 0; justify-items: start; text-align: left; align-items: center; }\n    .cl .cl-ico { grid-row: span 2; margin-bottom: 0; }\n    .cl .cl-flow strong { align-self: end; }\n    .cl .cl-flow .cl-d { align-self: start; }\n  }\n\n  /* Requirements: check marks */\n  .cl .cl-needs { display: grid; gap: 0.55rem; }\n  .cl .cl-needs li { position: relative; padding-left: 1.8rem; }\n  .cl .cl-needs li::before {\n    content: \"\";\n    position: absolute;\n    left: 0.3rem;\n    top: 0.3em;\n    width: 0.45rem;\n    height: 0.8rem;\n    border: solid var(--cl-ok);\n    border-width: 0 2.5px 2.5px 0;\n    transform: rotate(45deg);\n  }\n\n  /* Device switch (CSS only) */\n  .cl .cl-device { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }\n  .cl .cl-device legend { float: left; margin-right: 0.25rem; font-weight: 600; }\n  .cl .cl-seg { display: inline-flex; background: var(--cl-soft); border-radius: 12px; padding: 4px; gap: 4px; }\n  .cl .cl-seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }\n  .cl .cl-seg label {\n    font-size: 0.9rem;\n    font-weight: 600;\n    color: var(--cl-muted);\n    padding: 0.45rem 1.1rem;\n    border-radius: 9px;\n    cursor: pointer;\n  }\n  .cl .cl-seg input:checked + label { background: var(--cl-surface); color: var(--cl-ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); }\n  .cl .cl-seg input:focus-visible + label { outline: 3px solid var(--cl-ink); outline-offset: 2px; }\n  .cl:has(#cl-mac:checked) .cl-ios,\n  .cl:has(#cl-ios:checked) .cl-mac { display: none !important; }\n\n  /* Steps */\n  .cl .cl-step { border-top: 1px solid var(--cl-rule); padding-top: 1.9rem; }\n  .cl .cl-step h2 { display: grid; gap: 0.3rem; }\n  .cl .cl-why { color: var(--cl-muted); }\n\n  /* Checkable tasks */\n  .cl .cl-tasks { display: grid; gap: 0.1rem; }\n  .cl .cl-tasks label { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.35rem 0; cursor: pointer; }\n  .cl .cl-tasks input {\n    flex: none;\n    width: 1.15rem;\n    height: 1.15rem;\n    margin: 0.17rem 0 0;\n    accent-color: var(--cl-ink);\n    cursor: pointer;\n  }\n  .cl .cl-tasks input:checked + span { color: var(--cl-muted); }\n\n  /* Cards */\n  .cl .cl-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.75rem; }\n  .cl .cl-card {\n    background: var(--cl-surface);\n    border: 1px solid var(--cl-rule);\n    border-radius: 14px;\n    padding: 1rem 1.1rem 1.1rem;\n    display: grid;\n    gap: 0.45rem;\n    align-content: start;\n    min-width: 0;\n  }\n  .cl .cl-card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }\n  .cl .cl-badge {\n    font-size: 0.72rem;\n    font-weight: 600;\n    border: 1px solid var(--cl-ink);\n    border-radius: 999px;\n    padding: 0.05rem 0.5rem;\n  }\n  .cl .cl-card p, .cl .cl-card .cl-tasks { font-size: 0.9rem; }\n  .cl .cl-btn {\n    justify-self: start;\n    margin-top: 0.35rem;\n    background: var(--cl-btn);\n    color: var(--cl-btn-ink);\n    text-decoration: none;\n    border-radius: 10px;\n    padding: 0.6rem 0.95rem;\n    font-size: 0.9rem;\n  }\n  .cl .cl-btn:hover { opacity: 0.88; }\n  .cl .cl-note {\n    font-size: 0.9rem;\n    background: var(--cl-soft);\n    border-radius: 12px;\n    padding: 0.75rem 0.9rem;\n  }\n\n  /* Second device (details) */\n  .cl .cl-more { border: 1px solid var(--cl-rule); border-radius: 14px; background: var(--cl-surface); }\n  .cl .cl-more summary {\n    list-style: none;\n    cursor: pointer;\n    padding: 0.9rem 1.1rem;\n    font-weight: 600;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 0.75rem;\n  }\n  .cl .cl-more summary::-webkit-details-marker { display: none; }\n  .cl .cl-more summary::after {\n    content: \"\";\n    flex: none;\n    width: 0.5rem;\n    height: 0.5rem;\n    border: solid var(--cl-muted);\n    border-width: 0 2px 2px 0;\n    transform: rotate(45deg);\n    margin-top: -0.2rem;\n  }\n  .cl .cl-more[open] summary::after { transform: rotate(-135deg); margin-top: 0.2rem; }\n  .cl .cl-more-body { padding: 0 1.1rem 1.1rem; display: grid; gap: 0.9rem; }\n  .cl .cl-more-body .cl-card { background: var(--cl-bg); }\n\n  /* Messages */\n  .cl .cl-rows { display: grid; }\n  .cl .cl-rows li {\n    display: grid;\n    grid-template-columns: minmax(0, 17rem) minmax(0, 1fr);\n    gap: 1rem;\n    align-items: center;\n    padding: 0.85rem 0;\n    border-bottom: 1px solid var(--cl-rule);\n    max-width: none;\n  }\n  .cl .cl-rows li:first-child { padding-top: 0; }\n  .cl .cl-rows p { font-size: 0.9rem; }\n  .cl .cl-issue { font-weight: 600; font-size: 0.9rem; }\n  .cl .cl-msg {\n    background: var(--cl-soft);\n    border-radius: 14px;\n    padding: 0.6rem 0.8rem;\n    font-size: 0.88rem;\n    line-height: 1.35;\n  }\n  .cl .cl-msg em { font-style: normal; color: var(--cl-muted); }\n  .cl .cl-meaning { display: flex; gap: 0.6rem; align-items: flex-start; }\n  .cl .cl-status { flex: none; width: 1.25rem; height: 1.25rem; margin-top: 0.05rem; }\n  .cl .cl-status .cl-g { stroke: var(--cl-surface); }\n  .cl .cl-status .cl-gd { fill: var(--cl-surface); }\n  .cl .cl-status.ok { color: var(--cl-ok); }\n  .cl .cl-status.warn { color: var(--cl-warn); }\n  .cl .cl-status.bad { color: var(--cl-bad); }\n  @media (max-width: 600px) {\n    .cl .cl-rows li { grid-template-columns: 1fr; gap: 0.5rem; }\n  }\n\n  .cl .cl-bullets { display: grid; gap: 0.5rem; }\n  .cl .cl-bullets li { position: relative; padding-left: 1.1rem; }\n  .cl .cl-bullets li::before {\n    content: \"\";\n    position: absolute;\n    left: 0.15rem;\n    top: 0.65em;\n    width: 0.32rem;\n    height: 0.32rem;\n    border-radius: 50%;\n    background: var(--cl-muted);\n  }\n\n  /* Fields */\n  .cl .cl-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 1.5rem; }\n  .cl .cl-field { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--cl-rule); font-size: 0.9rem; }\n  .cl .cl-field dt { font-weight: 600; }\n  .cl .cl-field dd { color: var(--cl-muted); }\n  @media (max-width: 640px) {\n    .cl .cl-fields { grid-template-columns: 1fr; }\n    .cl .cl-field { grid-template-columns: 6.5rem minmax(0, 1fr); }\n  }\n", "body": "<div class=\"cl-page\">\n<div class=\"cl\">\n\n  <header>\n    <h1>Creator Lead Generator<\/h1>\n    <p class=\"cl-intro\">An Apple Shortcut for iPhone and Mac. Open a creator’s profile on Instagram, TikTok, YouTube, Threads, or X, trigger the shortcut, and AI adds the creator to your own Google Sheet lead tracker. No copying and pasting, and every lead lands in one list you can sort, filter, and follow up on.<\/p>\n  <\/header>\n\n  <section aria-labelledby=\"cl-how\">\n    <h2 id=\"cl-how\" class=\"cl-label\">How it works<\/h2>\n    <ol class=\"cl-flow\">\n      <li>\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\" fill=\"none\"/><path d=\"M4 20c1.5-4 4.4-6 8-6s6.5 2 8 6\" fill=\"none\"/><\/svg><\/span>\n        <strong>Open a profile<\/strong>\n        <span class=\"cl-d\">Instagram, TikTok, YouTube, Threads, or X<\/span>\n      <\/li>\n      <li>\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2.5L5 13.5h6l-1 8 8-11h-6z\" fill=\"none\"/><\/svg><\/span>\n        <strong>Trigger the shortcut<\/strong>\n        <span class=\"cl-d\">Action Button, Back Tap, or a keyboard shortcut<\/span>\n      <\/li>\n      <li>\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 3.5l1.7 4.8 4.8 1.7-4.8 1.7L11 16.5l-1.7-4.8L4.5 10l4.8-1.7z\" fill=\"none\"/><path d=\"M18 14.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z\" fill=\"none\"/><\/svg><\/span>\n        <strong>AI reads the screen<\/strong>\n        <span class=\"cl-d\">It picks out the creator’s details<\/span>\n      <\/li>\n      <li>\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\" fill=\"none\"/><path d=\"M3.5 9.5h17M12 12.5v5M9.5 15h5\" fill=\"none\"/><\/svg><\/span>\n        <strong>Lead added<\/strong>\n        <span class=\"cl-d\">A new row in your lead tracker<\/span>\n      <\/li>\n    <\/ol>\n  <\/section>\n\n  <section aria-labelledby=\"cl-need\">\n    <h2 id=\"cl-need\">You’ll need<\/h2>\n    <ul class=\"cl-needs\">\n      <li>An iPhone 15 Pro or newer, or a Mac with Apple silicon, on the latest software<\/li>\n      <li>Apple Intelligence turned on in <span class=\"cl-path\">Settings › Apple Intelligence &amp; Siri<\/span>. For the ChatGPT version, also turn on the ChatGPT extension there. No ChatGPT account needed.<\/li>\n      <li>A Google account<\/li>\n    <\/ul>\n  <\/section>\n\n  <fieldset class=\"cl-device\">\n    <legend>I’m setting up on<\/legend>\n    <div class=\"cl-seg\">\n      <input type=\"radio\" name=\"cl-device\" id=\"cl-ios\" checked><label for=\"cl-ios\">iPhone<\/label>\n      <input type=\"radio\" name=\"cl-device\" id=\"cl-mac\"><label for=\"cl-mac\">Mac<\/label>\n    <\/div>\n  <\/fieldset>\n\n  <section class=\"cl-step\" aria-labelledby=\"cl-s1\">\n    <h2 id=\"cl-s1\"><span class=\"cl-label\">Step 1 · In your browser<\/span> Create your Google Form<\/h2>\n    <p class=\"cl-why\">Your own copy of the Lead Form. The shortcut sends each new lead to it.<\/p>\n    <ul class=\"cl-tasks\">\n      <li><label><input type=\"checkbox\" id=\"cl-t1a\"><span>Open the <a href=\"https://docs.google.com/forms/d/1bOR_J_U3KiF0CPIvfICX2OPkpkL8U-2zwIdujDqRvYo/copy\">Lead Form link<\/a> and select <strong>Make a copy<\/strong><\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t1b\"><span>Select <strong>Publish<\/strong> (top right), make sure responders are set to <strong>Anyone with the link<\/strong>, and publish<\/span><\/label><\/li>\n      <li class=\"cl-ios\"><label><input type=\"checkbox\" id=\"cl-t1c\"><span>Copy the form’s URL: tap your browser’s <span class=\"cl-path\">Share › Copy<\/span><\/span><\/label><\/li>\n      <li class=\"cl-mac\"><label><input type=\"checkbox\" id=\"cl-t1d\"><span>Copy the form’s URL from the address bar<\/span><\/label><\/li>\n    <\/ul>\n    <p class=\"cl-note\">Use the full URL that starts with <strong>docs.google.com/forms<\/strong>. Shortened <strong>forms.gle<\/strong> links won’t work.<\/p>\n  <\/section>\n\n  <section class=\"cl-step\" aria-labelledby=\"cl-s2\">\n    <h2 id=\"cl-s2\"><span class=\"cl-label\">Step 2 · <span class=\"cl-ios\">On your iPhone<\/span><span class=\"cl-mac\">On your Mac<\/span><\/span> Add the shortcut<\/h2>\n    <p class=\"cl-why\">Pick one. Both fill the same columns but use a different AI model.<\/p>\n    <div class=\"cl-pair\">\n      <div class=\"cl-card\">\n        <div class=\"cl-card-head\"><h3>With ChatGPT<\/h3><span class=\"cl-badge\">Recommended<\/span><\/div>\n        <p class=\"cl-muted\">Uses ChatGPT. Needs the ChatGPT extension.<\/p>\n        <a class=\"cl-btn\" href=\"https://www.icloud.com/shortcuts/d52740914b284104a9790844dcaa1d97\">Add Leads GPT<\/a>\n      <\/div>\n      <div class=\"cl-card\">\n        <div class=\"cl-card-head\"><h3>Without ChatGPT<\/h3><\/div>\n        <p class=\"cl-muted\">Uses Apple’s Private Cloud Compute. Apple sets a daily limit.<\/p>\n        <a class=\"cl-btn\" href=\"https://www.icloud.com/shortcuts/a2ddeddc1f1840afa1176774b6d9ec30\">Add Leads Non-GPT<\/a>\n      <\/div>\n    <\/div>\n    <ul class=\"cl-tasks cl-ios\">\n      <li><label><input type=\"checkbox\" id=\"cl-t2a\"><span>Tap <strong>Set Up Shortcut<\/strong><\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t2b\"><span>Paste your form’s URL into “Paste your Lead Form link”<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t2c\"><span>Tap <strong>Add Shortcut<\/strong><\/span><\/label><\/li>\n    <\/ul>\n    <ul class=\"cl-tasks cl-mac\">\n      <li><label><input type=\"checkbox\" id=\"cl-t2d\"><span>Click <strong>Add Shortcut<\/strong><\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t2e\"><span>Paste your form’s URL into “Paste your Lead Form link”<\/span><\/label><\/li>\n    <\/ul>\n  <\/section>\n\n  <section class=\"cl-step\" aria-labelledby=\"cl-s3\">\n    <h2 id=\"cl-s3\"><span class=\"cl-label\">Step 3 · In your browser<\/span> Create your lead tracker<\/h2>\n    <p class=\"cl-why\">Link a Google Sheet to your form. This sheet is your lead tracker: every creator you save is added as a new row.<\/p>\n    <ul class=\"cl-tasks\">\n      <li><label><input type=\"checkbox\" id=\"cl-t3a\"><span>Go back to your form<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t3b\"><span>Select <span class=\"cl-path\">Responses › Link to Sheets › Create a new spreadsheet › Create<\/span><\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t3c\"><span>Bookmark the sheet so it’s easy to find<\/span><\/label><\/li>\n    <\/ul>\n  <\/section>\n\n  <section class=\"cl-step\" aria-labelledby=\"cl-s4\">\n    <h2 id=\"cl-s4\"><span class=\"cl-label\">Step 4 · <span class=\"cl-ios\">On your iPhone<\/span><span class=\"cl-mac\">On your Mac<\/span><\/span> Choose how to trigger it<\/h2>\n    <p class=\"cl-why\">Triggering the shortcut is what runs it. Pick one way.<\/p>\n\n    <!-- iPhone triggers -->\n    <div class=\"cl-pair cl-ios\">\n      <div class=\"cl-card\">\n        <h3>Action Button<\/h3>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-t4a\"><span>Open <span class=\"cl-path\">Settings › Action Button<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4b\"><span>Swipe to <strong>Shortcut<\/strong><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4c\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"cl-card\">\n        <h3>Back Tap<\/h3>\n        <p class=\"cl-muted\">If your Action Button already does something else.<\/p>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-t4d\"><span>Open <span class=\"cl-path\">Settings › Accessibility › Touch › Back Tap<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4e\"><span>Choose <strong>Double Tap<\/strong> or <strong>Triple Tap<\/strong><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4f\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <!-- Mac triggers -->\n    <div class=\"cl-pair cl-mac\">\n      <div class=\"cl-card\">\n        <h3>Keyboard shortcut<\/h3>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-t4g\"><span>In the Shortcuts app, double-click your Leads shortcut<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4h\"><span>Click the details button (ⓘ)<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4i\"><span>Click <strong>Add Keyboard Shortcut<\/strong><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-t4j\"><span>Press a key combination you don’t use for anything else<\/span><\/label><\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"cl-card\">\n        <h3>Spotlight<\/h3>\n        <p class=\"cl-muted\">No setup needed. Each time, press <strong>⌘ Space<\/strong>, type your shortcut’s name, and press <strong>Return<\/strong>.<\/p>\n      <\/div>\n    <\/div>\n\n    <!-- Add the other device: shown after an iPhone setup -->\n    <details class=\"cl-more cl-ios\">\n      <summary>Also have a Mac? Set it up there too<\/summary>\n      <div class=\"cl-more-body\">\n        <p class=\"cl-muted cl-small\">Same shortcut, same lead tracker. Only the trigger is different. Both devices need the same Apple Account.<\/p>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-x1a\"><span>On your iPhone, turn on iCloud Sync in <span class=\"cl-path\">Settings › Shortcuts<\/span> (on newer iOS, it’s under <span class=\"cl-path\">Settings › Apps › Shortcuts<\/span>)<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-x1b\"><span>On your Mac, open the Shortcuts app and turn on iCloud Sync in <span class=\"cl-path\">Shortcuts › Settings › General<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-x1c\"><span>On your Mac, turn on Apple Intelligence (and the ChatGPT extension, for the ChatGPT version) in <span class=\"cl-path\">System Settings › Apple Intelligence &amp; Siri<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-x1d\"><span>Check that your Leads shortcut shows up in the Shortcuts app on your Mac<\/span><\/label><\/li>\n        <\/ul>\n        <p class=\"cl-small\"><strong>Then pick a Mac trigger:<\/strong><\/p>\n        <div class=\"cl-pair\">\n          <div class=\"cl-card\">\n            <h3>Keyboard shortcut<\/h3>\n            <ul class=\"cl-tasks\">\n              <li><label><input type=\"checkbox\" id=\"cl-x1e\"><span>In the Shortcuts app, double-click your Leads shortcut<\/span><\/label><\/li>\n              <li><label><input type=\"checkbox\" id=\"cl-x1f\"><span>Click the details button (ⓘ)<\/span><\/label><\/li>\n              <li><label><input type=\"checkbox\" id=\"cl-x1g\"><span>Click <strong>Add Keyboard Shortcut<\/strong><\/span><\/label><\/li>\n              <li><label><input type=\"checkbox\" id=\"cl-x1h\"><span>Press a key combination you don’t use for anything else<\/span><\/label><\/li>\n            <\/ul>\n          <\/div>\n          <div class=\"cl-card\">\n            <h3>Spotlight<\/h3>\n            <p class=\"cl-muted\">No setup needed. Each time, press <strong>⌘ Space<\/strong>, type your shortcut’s name, and press <strong>Return<\/strong>.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/details>\n\n    <!-- Add the other device: shown after a Mac setup -->\n    <details class=\"cl-more cl-mac\">\n      <summary>Also have an iPhone? Set it up there too<\/summary>\n      <div class=\"cl-more-body\">\n        <p class=\"cl-muted cl-small\">Same shortcut, same lead tracker. Only the trigger is different. Both devices need the same Apple Account.<\/p>\n        <ul class=\"cl-tasks\">\n          <li><label><input type=\"checkbox\" id=\"cl-x2a\"><span>On your Mac, open the Shortcuts app and turn on iCloud Sync in <span class=\"cl-path\">Shortcuts › Settings › General<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-x2b\"><span>On your iPhone, turn on iCloud Sync in <span class=\"cl-path\">Settings › Shortcuts<\/span> (on newer iOS, it’s under <span class=\"cl-path\">Settings › Apps › Shortcuts<\/span>)<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-x2c\"><span>On your iPhone, turn on Apple Intelligence (and the ChatGPT extension, for the ChatGPT version) in <span class=\"cl-path\">Settings › Apple Intelligence &amp; Siri<\/span><\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\" id=\"cl-x2d\"><span>Check that your Leads shortcut shows up in the Shortcuts app on your iPhone<\/span><\/label><\/li>\n        <\/ul>\n        <p class=\"cl-small\"><strong>Then pick an iPhone trigger:<\/strong><\/p>\n        <div class=\"cl-pair\">\n          <div class=\"cl-card\">\n            <h3>Action Button<\/h3>\n            <ul class=\"cl-tasks\">\n              <li><label><input type=\"checkbox\" id=\"cl-x2e\"><span>Open <span class=\"cl-path\">Settings › Action Button<\/span><\/span><\/label><\/li>\n              <li><label><input type=\"checkbox\" id=\"cl-x2f\"><span>Swipe to <strong>Shortcut<\/strong><\/span><\/label><\/li>\n              <li><label><input type=\"checkbox\" id=\"cl-x2g\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n            <\/ul>\n          <\/div>\n          <div class=\"cl-card\">\n            <h3>Back Tap<\/h3>\n            <p class=\"cl-muted\">If your Action Button already does something else.<\/p>\n            <ul class=\"cl-tasks\">\n              <li><label><input type=\"checkbox\" id=\"cl-x2h\"><span>Open <span class=\"cl-path\">Settings › Accessibility › Touch › Back Tap<\/span><\/span><\/label><\/li>\n              <li><label><input type=\"checkbox\" id=\"cl-x2i\"><span>Choose <strong>Double Tap<\/strong> or <strong>Triple Tap<\/strong><\/span><\/label><\/li>\n              <li><label><input type=\"checkbox\" id=\"cl-x2j\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/details>\n  <\/section>\n\n  <section class=\"cl-step\" aria-labelledby=\"cl-s5\">\n    <h2 id=\"cl-s5\"><span class=\"cl-label\">Step 5<\/span> Start tracking leads<\/h2>\n    <ul class=\"cl-tasks\">\n      <li><label><input type=\"checkbox\" id=\"cl-t5a\"><span>Open a creator’s main profile page (not a video or post)<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5b\"><span>Trigger the shortcut<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5c\"><span>First time only: choose <strong>Always Allow<\/strong> on each pop-up<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5d\"><span>Look for “Saved: [name] ([platform])”<\/span><\/label><\/li>\n      <li><label><input type=\"checkbox\" id=\"cl-t5e\"><span>Open your lead tracker and find the new row<\/span><\/label><\/li>\n    <\/ul>\n  <\/section>\n\n  <section aria-labelledby=\"cl-msgs\">\n    <h2 id=\"cl-msgs\">Messages you’ll see<\/h2>\n    <ul class=\"cl-rows\">\n      <li>\n        <div class=\"cl-msg\">Saved: <em>[name]<\/em> (<em>[platform]<\/em>)<\/div>\n        <div class=\"cl-meaning\">\n          <svg class=\"cl-status ok\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"currentColor\"/><path d=\"M6 10.3l2.6 2.6L14 7.5\" class=\"cl-g\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <p>It worked. The creator is in your lead tracker.<\/p>\n        <\/div>\n      <\/li>\n      <li>\n        <div class=\"cl-msg\">Couldn’t read a profile here. Open the creator’s profile page and try again.<\/div>\n        <div class=\"cl-meaning\">\n          <svg class=\"cl-status warn\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"currentColor\"/><path d=\"M10 5.5v5.5\" class=\"cl-g\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"10\" cy=\"14.2\" r=\"1.15\" class=\"cl-gd\"/><\/svg>\n          <p>Nothing was saved. Make sure you’re on the creator’s actual profile page, not a video, post, or About page.<\/p>\n        <\/div>\n      <\/li>\n      <li>\n        <div class=\"cl-msg\">Not saved. Your form link may be wrong, or the form isn’t published.<\/div>\n        <div class=\"cl-meaning\">\n          <svg class=\"cl-status bad\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"currentColor\"/><path d=\"M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4\" class=\"cl-g\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>\n          <p>Check that your form is published (Step 1). If it is, delete the shortcut and redo Step 2 with your form’s full URL.<\/p>\n        <\/div>\n      <\/li>\n    <\/ul>\n  <\/section>\n\n  <section aria-labelledby=\"cl-trouble\">\n    <h2 id=\"cl-trouble\">Troubleshooting<\/h2>\n    <ul class=\"cl-rows\">\n      <li>\n        <span class=\"cl-issue\">Saved, but some details are wrong<\/span>\n        <p>Use the main profile page, with the follower count showing.<\/p>\n      <\/li>\n      <li>\n        <span class=\"cl-issue\">Can’t make a copy of the form<\/span>\n        <p>Sign in to Google, then open the link again.<\/p>\n      <\/li>\n      <li>\n        <span class=\"cl-issue\">No Apple Intelligence in Settings<\/span>\n        <p>Check that your device is supported (see You’ll need) and that your device language and Siri language match.<\/p>\n      <\/li>\n    <\/ul>\n  <\/section>\n\n  <section aria-labelledby=\"cl-know\">\n    <h2 id=\"cl-know\">Good to know<\/h2>\n    <ul class=\"cl-bullets\">\n      <li>It reads only what’s on screen, and AI can misread. Double-check key details.<\/li>\n      <li>Long bio links can get cut off. Open the Profile Link to see the full bio.<\/li>\n      <li>Each trigger adds a new row, so triggering twice saves the creator twice.<\/li>\n      <li>Your screenshot goes to the AI you picked. The details go to your own form.<\/li>\n    <\/ul>\n  <\/section>\n\n  <section aria-labelledby=\"cl-cols\">\n    <h2 id=\"cl-cols\">What each lead includes<\/h2>\n    <dl class=\"cl-fields\">\n      <div class=\"cl-field\"><dt>Timestamp<\/dt><dd>When it was saved<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Name<\/dt><dd>The creator’s display name<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Status<\/dt><dd>Starts as “New.” Update it as you reach out.<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Handle<\/dt><dd>Their username, without the @<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Profile Link<\/dt><dd>A link to their profile<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Platform<\/dt><dd>Instagram, TikTok, YouTube, Threads, or X<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Followers<\/dt><dd>Follower or subscriber count<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Category<\/dt><dd>Their main niche, like Comedy or Tech<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Location<\/dt><dd>If shown on the profile<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Snapchat<\/dt><dd>If shown on the profile<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Email<\/dt><dd>If shown on the profile<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Bio Links<\/dt><dd>If shown on the profile<\/dd><\/div>\n      <div class=\"cl-field\"><dt>Notes<\/dt><dd>Blank, for your own notes<\/dd><\/div>\n    <\/dl>\n  <\/section>\n\n<\/div>\n<\/div>"}, {"v": 13, "name": "Color-coded steps", "desc": "A color per step and a progress tracker", "css": "\n  /* Layout: phone-first single column, all scoped under .cl so it can drop into a Squarespace code block.\n     Each setup step has its own color (Forms purple, Shortcuts pink, Sheets green, trigger orange, start blue) used on the roadmap, the step badge and its checkboxes.\n     Progress is CSS-only: when a step's boxes are all checked, its roadmap dot and badge turn into checks and the counter goes up. A tiny script only remembers checks between visits. */\n  :host {\n    --cl-bg: #f6f6f9;\n    --cl-surface: #ffffff;\n    --cl-ink: #17171f;\n    --cl-muted: #5e5f6e;\n    --cl-rule: #e5e5ee;\n    --cl-soft: #efeff4;\n    --cl-on-fill: #ffffff;\n    --cl-s1: #7048e8;  --cl-s1-soft: #f0ebff;  --cl-s1-ink: #5a35d0;\n    --cl-s2: #e03d7b;  --cl-s2-soft: #ffeaf2;  --cl-s2-ink: #c2245f;\n    --cl-s3: #1e8e3e;  --cl-s3-soft: #e6f5eb;  --cl-s3-ink: #17753a;\n    --cl-s4: #ee6a1f;  --cl-s4-soft: #fff0e5;  --cl-s4-ink: #b54b0c;\n    --cl-s5: #2f6bff;  --cl-s5-soft: #e9f0ff;  --cl-s5-ink: #2153d6;\n    --cl-ok: #1f8a4c;\n    --cl-warn: #c58400;\n    --cl-bad: #d1342f;\n  }\n  @media (prefers-color-scheme: dark) {\n    :host(:not([data-theme=\"light\"])) {\n      --cl-bg: #0f0f14;\n      --cl-surface: #17171e;\n      --cl-ink: #f2f2f6;\n      --cl-muted: #a3a3b2;\n      --cl-rule: #2a2a35;\n      --cl-soft: #22222b;\n      --cl-on-fill: #111117;\n      --cl-s1: #a68bff;  --cl-s1-soft: #241d3d;  --cl-s1-ink: #bba6ff;\n      --cl-s2: #ff74a8;  --cl-s2-soft: #3a1a29;  --cl-s2-ink: #ff8fb8;\n      --cl-s3: #4fc77b;  --cl-s3-soft: #142e1e;  --cl-s3-ink: #6bd492;\n      --cl-s4: #ff9a55;  --cl-s4-soft: #3a2414;  --cl-s4-ink: #ffad74;\n      --cl-s5: #7aa2ff;  --cl-s5-soft: #172442;  --cl-s5-ink: #93b4ff;\n      --cl-ok: #4cc47f;\n      --cl-warn: #f2b53c;\n      --cl-bad: #ff6b61;\n      color-scheme: dark;\n    }\n  }\n  :host([data-theme=\"dark\"]) {\n    --cl-bg: #0f0f14;\n    --cl-surface: #17171e;\n    --cl-ink: #f2f2f6;\n    --cl-muted: #a3a3b2;\n    --cl-rule: #2a2a35;\n    --cl-soft: #22222b;\n    --cl-on-fill: #111117;\n    --cl-s1: #a68bff;  --cl-s1-soft: #241d3d;  --cl-s1-ink: #bba6ff;\n    --cl-s2: #ff74a8;  --cl-s2-soft: #3a1a29;  --cl-s2-ink: #ff8fb8;\n    --cl-s3: #4fc77b;  --cl-s3-soft: #142e1e;  --cl-s3-ink: #6bd492;\n    --cl-s4: #ff9a55;  --cl-s4-soft: #3a2414;  --cl-s4-ink: #ffad74;\n    --cl-s5: #7aa2ff;  --cl-s5-soft: #172442;  --cl-s5-ink: #93b4ff;\n    --cl-ok: #4cc47f;\n    --cl-warn: #f2b53c;\n    --cl-bad: #ff6b61;\n    color-scheme: dark;\n  }\n  .vh-doc { background: var(--cl-bg); color: var(--cl-ink); }\n  .cl-page { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 2.5rem 5rem; }\n\n  /* ===== Guide (portable) ===== */\n  .cl {\n    --cl-sans: \"Geist\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    --cl-mono: \"Geist Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n    font-family: var(--cl-sans);\n    font-size: 1rem;\n    line-height: 1.5;\n    color: var(--cl-ink);\n    -webkit-font-smoothing: antialiased;\n    display: grid;\n    gap: 2.5rem;\n  }\n  .cl *, .cl *::before, .cl *::after { box-sizing: border-box; }\n  .cl h1, .cl h2, .cl h3, .cl p, .cl ul, .cl ol, .cl fieldset, .cl legend { margin: 0; padding: 0; border: 0; }\n  .cl h1, .cl h2, .cl h3 { font-family: var(--cl-sans); color: var(--cl-ink); text-transform: none; }\n  .cl ul, .cl ol { list-style: none; }\n  .cl p, .cl li { font-size: inherit; line-height: inherit; }\n  .cl section, .cl header { display: grid; gap: 1rem; min-width: 0; }\n  .cl a { color: inherit; font-weight: 600; text-underline-offset: 0.2em; text-decoration-thickness: 1.5px; }\n  .cl a:focus-visible, .cl summary:focus-visible, .cl button:focus-visible { outline: 3px solid var(--cl-ink); outline-offset: 3px; border-radius: 8px; }\n  .cl strong, .cl .cl-path { font-weight: 600; }\n  .cl .cl-muted { color: var(--cl-muted); }\n  .cl .cl-small { font-size: 0.9rem; }\n  .cl svg { display: block; }\n\n  .cl h1 { font-size: clamp(2.2rem, 8vw, 3rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; text-wrap: balance; }\n  .cl h2 { font-size: 1.3rem; font-weight: 650; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }\n  .cl h3 { font-size: 0.98rem; fon 0.75rem;\n    align-items: center;\n    background: var(--cl-s3-soft);\n    color: var(--cl-s3-ink);\n    border-radius: 14px;\n    padding: 0.85rem 1rem;\n    font-weight: 600;\n  }\n  .cl .cl-finish svg { flex: none; width: 1.5rem; height: 1.5rem; }\n  .cl .cl-finish .cl-fk { stroke: var(--cl-s3-soft); }\n  .cl .cl-step-body a:not(.cl-btn) { color: var(--c-ink); }\n\n  /* ---------- Messages & troubleshooting ---------- */\n  .cl .cl-panel { background: var(--cl-surface); border: 1px solid var(--cl-rule); border-radius: 20px; padding: 1.1rem 1.15rem; display: grid; gap: 0.9rem; }\n  .cl .cl-rows { display: grid; }\n  .cl .cl-rows li {\n    display: grid;\n    grid-template-columns: minmax(0, 16.5rem) minmax(0, 1fr);\n    gap: 1rem;\n    align-items: center;\n    padding: 0.8rem 0;\n    border-top: 1px solid var(--cl-rule);\n  }\n  .cl .cl-rows li:first-child { border-top: 0; padding-top: 0; }\n  .cl .cl-rows li:last-child { padding-bottom: 0; }\n  .cl .cl-rows p { font-size: 0.9rem; }\n  .cl .cl-issue { font-weight: 600; font-size: 0.9rem; }\n  .cl .cl-msg {\n    background: var(--cl-soft);\n    border-radius: 14px;\n    padding: 0.6rem 0.8rem;\n    font-size: 0.86rem;\n    line-height: 1.35;\n  }\n  .cl .cl-msg em { font-style: normal; color: var(--cl-muted); }\n  .cl .cl-meaning { display: flex; gap: 0.6rem; align-items: flex-start; }\n  .cl .cl-status { flex: none; width: 1.3rem; height: 1.3rem; margin-top: 0.02rem; }\n  .cl .cl-status .cl-g { stroke: var(--cl-surface); }\n  .cl .cl-status .cl-gd { fill: var(--cl-surface); }\n  .cl .cl-status.ok { color: var(--cl-ok); }\n  .cl .cl-status.warn { color: var(--cl-warn); }\n  .cl .cl-status.bad { color: var(--cl-bad); }\n  @media (max-width: 600px) { .cl .cl-rows li { grid-template-columns: 1fr; gap: 0.5rem; } }\n\n  /* ---------- Good to know tiles ---------- */\n  .cl .cl-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }\n  .cl .cl-tile {\n    background: var(--cl-surface);\n    border: 1px solid var(--cl-rule);\n    border-radius: 16px;\n    padding: 0.95rem 1rem;\n    display: grid;\n    grid-template-columns: 2.25rem minmax(0, 1fr);\n    gap: 0.2rem 0.8rem;\n    align-items: start;\n  }\n  .cl .cl-tile .cl-ico2 {\n    grid-row: span 2;\n    width: 2.25rem;\n    height: 2.25rem;\n    border-radius: 12px;\n    display: grid;\n    place-items: center;\n    background: var(--c-soft);\n    color: var(--c-ink);\n  }\n  .cl .cl-tile .cl-ico2 svg { width: 1.15rem; height: 1.15rem; }\n  .cl .cl-tile strong { font-size: 0.92rem; }\n  .cl .cl-tile p { font-size: 0.85rem; color: var(--cl-muted); }\n  @media (max-width: 600px) { .cl .cl-tiles { grid-template-columns: 1fr; } }\n\n  /* ---------- Lead fields ---------- */\n  .cl .cl-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }\n  .cl .cl-f {\n    background: var(--cl-surface);\n    border: 1px solid var(--cl-rule);\n    border-radius: 12px;\n    padding: 0.6rem 0.75rem;\n    min-width: 0;\n    display: grid;\n    gap: 0.1rem;\n  }\n  .cl .cl-f .cl-fl {\n    font-family: var(--cl-mono);\n    font-size: 0.68rem;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--cl-muted);\n  }\n  .cl .cl-f .cl-fv { font-size: 0.88rem; font-weight: 600; overflow-wrap: anywhere; }\n  .cl .cl-f.cl-yours { background: var(--cl-s3-soft); border-color: transparent; }\n  .cl .cl-f.cl-yours .cl-fv { color: var(--cl-s3-ink); }\n  .cl .cl-f .cl-if { font-weight: 400; color: var(--cl-muted); }\n  @media (max-width: 600px) { .cl .cl-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n\n  @media (prefers-reduced-motion: reduce) {\n    .cl .cl-more summary .cl-plus { transition: none; }\n  }\n", "body": "<div class=\"cl-page\">\n<div class=\"cl\">\n\n  <!-- ===== Hero ===== -->\n  <header>\n    <h1>Creator Lead Generator<\/h1>\n    <p class=\"cl-intro\">An Apple Shortcut for iPhone and Mac. Open a creator’s profile, trigger the shortcut, and AI adds them to your own Google Sheet lead tracker. No copying and pasting.<\/p>\n    <ol class=\"cl-flow\">\n      <li data-s=\"5\">\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\" fill=\"none\"/><path d=\"M4 20c1.5-4 4.4-6 8-6s6.5 2 8 6\" fill=\"none\"/><\/svg><\/span>\n        <strong>Open a profile<\/strong>\n        <span class=\"cl-d\">Instagram, TikTok, YouTube, Threads, or X<\/span>\n      <\/li>\n      <li data-s=\"4\">\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2.5L5 13.5h6l-1 8 8-11h-6z\" fill=\"none\"/><\/svg><\/span>\n        <strong>Trigger the shortcut<\/strong>\n        <span class=\"cl-d\">Action Button, Back Tap, or a keyboard shortcut<\/span>\n      <\/li>\n      <li data-s=\"1\">\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 3.5l1.7 4.8 4.8 1.7-4.8 1.7L11 16.5l-1.7-4.8L4.5 10l4.8-1.7z\" fill=\"none\"/><path d=\"M18 14.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z\" fill=\"none\"/><\/svg><\/span>\n        <strong>AI reads the screen<\/strong>\n        <span class=\"cl-d\">It picks out the creator’s details<\/span>\n      <\/li>\n      <li data-s=\"3\">\n        <span class=\"cl-ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\" fill=\"none\"/><path d=\"M3.5 9.5h17M12 12.5v5M9.5 15h5\" fill=\"none\"/><\/svg><\/span>\n        <strong>Lead added<\/strong>\n        <span class=\"cl-d\">A new row in your lead tracker<\/span>\n      <\/li>\n    <\/ol>\n  <\/header>\n\n  <!-- ===== You'll need ===== -->\n  <section aria-labelledby=\"cl-need\">\n    <h2 id=\"cl-need\">You’ll need<\/h2>\n    <ul class=\"cl-need\">\n      <li>\n        <span class=\"cl-tick\" aria-hidden=\"true\"><svg viewBox=\"0 0 16 16\"><path d=\"M3.5 8.4l2.9 2.9 6-6.1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n        <strong>A supported device<\/strong>\n        <span class=\"cl-muted\">iPhone 15 Pro or newer, or a Mac with Apple silicon, on the latest software<\/span>\n      <\/li>\n      <li>\n        <span class=\"cl-tick\" aria-hidden=\"true\"><svg viewBox=\"0 0 16 16\"><path d=\"M3.5 8.4l2.9 2.9 6-6.1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n        <strong>Apple Intelligence on<\/strong>\n        <span class=\"cl-muted\">In <span class=\"cl-path\">Settings › Apple Intelligence &amp; Siri<\/span>. Also turn on the ChatGPT extension there for the ChatGPT version.<\/span>\n      <\/li>\n      <li>\n        <span class=\"cl-tick\" aria-hidden=\"true\"><svg viewBox=\"0 0 16 16\"><path d=\"M3.5 8.4l2.9 2.9 6-6.1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n        <strong>A Google account<\/strong>\n        <span class=\"cl-muted\">For your own form and lead tracker<\/span>\n      <\/li>\n    <\/ul>\n  <\/section>\n\n  <!-- ===== Setup ===== -->\n  <section aria-labelledby=\"cl-setup\">\n    <div class=\"cl-setup-head\">\n      <h2 id=\"cl-setup\">Set up in 5 steps<\/h2>\n      <fieldset class=\"cl-device\">\n        <legend>I’m setting up on<\/legend>\n        <div class=\"cl-seg\">\n          <input type=\"radio\" name=\"cl-device\" id=\"cl-ios\" checked><label for=\"cl-ios\">iPhone<\/label>\n          <input type=\"radio\" name=\"cl-device\" id=\"cl-mac\"><label for=\"cl-mac\">Mac<\/label>\n        <\/div>\n      <\/fieldset>\n    <\/div>\n\n    <nav class=\"cl-roadmap\" aria-label=\"Setup progress\">\n      <ol class=\"cl-map\">\n        <li data-s=\"1\" data-map=\"1\"><a href=\"#cl-s1\"><span class=\"cl-dot\"><svg class=\"cl-i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2.5\" fill=\"none\"/><path d=\"M8.5 8h7M8.5 12h7M8.5 16h4\" fill=\"none\"/><\/svg><svg class=\"cl-k\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>Form<\/a><\/li>\n        <li data-s=\"2\" data-map=\"2\"><a href=\"#cl-s2\"><span class=\"cl-dot\"><svg class=\"cl-i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14\" fill=\"none\"/><\/svg><svg class=\"cl-k\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>Shortcut<\/a><\/li>\n        <li data-s=\"3\" data-map=\"3\"><a href=\"#cl-s3\"><span class=\"cl-dot\"><svg class=\"cl-i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2\" fill=\"none\"/><path d=\"M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10\" fill=\"none\"/><\/svg><svg class=\"cl-k\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>Tracker<\/a><\/li>\n        <li data-s=\"4\" data-map=\"4\"><a href=\"#cl-s4\"><span class=\"cl-dot\"><svg class=\"cl-i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M13 2.5L5 13.5h6l-1 8 8-11h-6z\" fill=\"none\"/><\/svg><svg class=\"cl-k\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>Trigger<\/a><\/li>\n        <li data-s=\"5\" data-map=\"5\"><a href=\"#cl-s5\"><span class=\"cl-dot\"><svg class=\"cl-i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 21V4M6 4.5h11l-2 4 2 4H6\" fill=\"none\"/><\/svg><svg class=\"cl-k\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>Start<\/a><\/li>\n      <\/ol>\n      <p class=\"cl-count\"><span class=\"cl-n\"><\/span> of 5 steps done<button type=\"button\" class=\"cl-reset\" id=\"cl-reset\" hidden>Clear checks<\/button><\/p>\n    <\/nav>\n  <\/section>\n\n  <!-- Step 1 -->\n  <section class=\"cl-step\" id=\"cl-s1\" data-s=\"1\" aria-labelledby=\"cl-h1\">\n    <div class=\"cl-step-head\">\n      <span class=\"cl-num\" aria-hidden=\"true\"><span class=\"cl-i\">1<\/span><svg class=\"cl-k\" viewBox=\"0 0 24 24\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n      <div>\n        <h2 id=\"cl-h1\">Create your Google Form<\/h2>\n        <p class=\"cl-why\">The shortcut sends each new lead here.<\/p>\n      <\/div>\n      <span class=\"cl-where\">Browser<\/span>\n    <\/div>\n    <div class=\"cl-step-body\">\n      <ul class=\"cl-tasks\">\n        <li><label><input type=\"checkbox\" id=\"cl-t1a\"><span>Open the <a href=\"https://docs.google.com/forms/d/1bOR_J_U3KiF0CPIvfICX2OPkpkL8U-2zwIdujDqRvYo/copy\">Lead Form link<\/a> and select <strong>Make a copy<\/strong><\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t1b\"><span>Select <strong>Publish<\/strong> (top right), make sure responders are set to <strong>Anyone with the link<\/strong>, and publish<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t1c\"><span>Copy the form’s URL<\/span><\/label><\/li>\n      <\/ul>\n      <p class=\"cl-tip\"><svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M10 2.8L18 17H2z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M10 8v4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><circle cx=\"10\" cy=\"14.4\" r=\"0.95\" fill=\"currentColor\"/><\/svg><span>Use the full URL that starts with <strong>docs.google.com/forms<\/strong>. Shortened <strong>forms.gle<\/strong> links won’t work.<\/span><\/p>\n    <\/div>\n  <\/section>\n\n  <!-- Step 2 -->\n  <section class=\"cl-step\" id=\"cl-s2\" data-s=\"2\" aria-labelledby=\"cl-h2\">\n    <div class=\"cl-step-head\">\n      <span class=\"cl-num\" aria-hidden=\"true\"><span class=\"cl-i\">2<\/span><svg class=\"cl-k\" viewBox=\"0 0 24 24\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n      <div>\n        <h2 id=\"cl-h2\">Add the shortcut<\/h2>\n        <p class=\"cl-why\">Pick one. Same columns, different AI model.<\/p>\n      <\/div>\n      <span class=\"cl-where\"><span class=\"cl-ios\">iPhone<\/span><span class=\"cl-mac\">Mac<\/span><\/span>\n    <\/div>\n    <div class=\"cl-step-body\">\n      <div class=\"cl-pair\">\n        <div class=\"cl-card cl-pick\">\n          <div class=\"cl-card-head\"><h3>With ChatGPT<\/h3><span class=\"cl-badge\">Recommended<\/span><\/div>\n          <p class=\"cl-muted\">Uses ChatGPT. Needs the ChatGPT extension.<\/p>\n          <a class=\"cl-btn\" href=\"https://www.icloud.com/shortcuts/d52740914b284104a9790844dcaa1d97\">Add Leads GPT<\/a>\n        <\/div>\n        <div class=\"cl-card\">\n          <div class=\"cl-card-head\"><h3>Without ChatGPT<\/h3><\/div>\n          <p class=\"cl-muted\">Uses Apple’s Private Cloud Compute. Apple sets a daily limit.<\/p>\n          <a class=\"cl-btn cl-ghost\" href=\"https://www.icloud.com/shortcuts/a2ddeddc1f1840afa1176774b6d9ec30\">Add Leads Non-GPT<\/a>\n        <\/div>\n      <\/div>\n      <ul class=\"cl-tasks cl-ios\">\n        <li><label><input type=\"checkbox\" id=\"cl-t2a\"><span>Tap <strong>Set Up Shortcut<\/strong><\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t2b\"><span>Paste your form’s URL into “Paste your Lead Form link”<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t2c\"><span>Tap <strong>Add Shortcut<\/strong><\/span><\/label><\/li>\n      <\/ul>\n      <ul class=\"cl-tasks cl-mac\">\n        <li><label><input type=\"checkbox\" id=\"cl-t2d\"><span>Click <strong>Add Shortcut<\/strong><\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t2e\"><span>Paste your form’s URL into “Paste your Lead Form link”<\/span><\/label><\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <!-- Step 3 -->\n  <section class=\"cl-step\" id=\"cl-s3\" data-s=\"3\" aria-labelledby=\"cl-h3\">\n    <div class=\"cl-step-head\">\n      <span class=\"cl-num\" aria-hidden=\"true\"><span class=\"cl-i\">3<\/span><svg class=\"cl-k\" viewBox=\"0 0 24 24\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n      <div>\n        <h2 id=\"cl-h3\">Create your lead tracker<\/h2>\n        <p class=\"cl-why\">A Google Sheet linked to your form. Every creator you save becomes a new row.<\/p>\n      <\/div>\n      <span class=\"cl-where\">Browser<\/span>\n    <\/div>\n    <div class=\"cl-step-body\">\n      <ul class=\"cl-tasks\">\n        <li><label><input type=\"checkbox\" id=\"cl-t3a\"><span>Go back to your form<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t3b\"><span>Select <span class=\"cl-path\">Responses › Link to Sheets › Create a new spreadsheet › Create<\/span><\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t3c\"><span>Bookmark the sheet so it’s easy to find<\/span><\/label><\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <!-- Step 4 -->\n  <section class=\"cl-step\" id=\"cl-s4\" data-s=\"4\" aria-labelledby=\"cl-h4\">\n    <div class=\"cl-step-head\">\n      <span class=\"cl-num\" aria-hidden=\"true\"><span class=\"cl-i\">4<\/span><svg class=\"cl-k\" viewBox=\"0 0 24 24\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n      <div>\n        <h2 id=\"cl-h4\">Choose how to trigger it<\/h2>\n        <p class=\"cl-why\">Triggering the shortcut is what runs it. Pick one.<\/p>\n      <\/div>\n      <span class=\"cl-where\"><span class=\"cl-ios\">iPhone<\/span><span class=\"cl-mac\">Mac<\/span><\/span>\n    <\/div>\n    <div class=\"cl-step-body\">\n\n      <div class=\"cl-pair cl-ios\">\n        <div class=\"cl-card\" id=\"cl-ab\">\n          <h3>Action Button<\/h3>\n          <ul class=\"cl-tasks\">\n            <li><label><input type=\"checkbox\" id=\"cl-t4a\"><span>Open <span class=\"cl-path\">Settings › Action Button<\/span><\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-t4b\"><span>Swipe to <strong>Shortcut<\/strong><\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-t4c\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"cl-card\" id=\"cl-bt\">\n          <h3>Back Tap<\/h3>\n          <p class=\"cl-muted\">If your Action Button already does something else.<\/p>\n          <ul class=\"cl-tasks\">\n            <li><label><input type=\"checkbox\" id=\"cl-t4d\"><span>Open <span class=\"cl-path\">Settings › Accessibility › Touch › Back Tap<\/span><\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-t4e\"><span>Choose <strong>Double Tap<\/strong> or <strong>Triple Tap<\/strong><\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-t4f\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"cl-pair cl-mac\">\n        <div class=\"cl-card\" id=\"cl-kb\">\n          <h3>Keyboard shortcut<\/h3>\n          <ul class=\"cl-tasks\">\n            <li><label><input type=\"checkbox\" id=\"cl-t4g\"><span>In the Shortcuts app, double-click your Leads shortcut<\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-t4h\"><span>Click the details button (ⓘ)<\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-t4i\"><span>Click <strong>Add Keyboard Shortcut<\/strong><\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-t4j\"><span>Press a key combination you don’t use elsewhere<\/span><\/label><\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"cl-card\" id=\"cl-sp\">\n          <h3>Spotlight<\/h3>\n          <p class=\"cl-muted\">No setup needed.<\/p>\n          <ul class=\"cl-tasks\">\n            <li><label><input type=\"checkbox\" id=\"cl-t4k\"><span>Press <strong>⌘ Space<\/strong>, type your shortcut’s name, and press <strong>Return<\/strong><\/span><\/label><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n\n      <details class=\"cl-more cl-ios\">\n        <summary><span class=\"cl-plus\" aria-hidden=\"true\"><svg viewBox=\"0 0 16 16\"><path d=\"M8 3v10M3 8h10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg><\/span>Also have a Mac? Set it up there too<\/summary>\n        <div class=\"cl-more-body\">\n          <p class=\"cl-muted cl-small\">Same shortcut, same lead tracker. Use the same Apple Account on both.<\/p>\n          <ul class=\"cl-tasks\">\n            <li><label><input type=\"checkbox\" id=\"cl-x1a\"><span>iPhone: turn on iCloud Sync in <span class=\"cl-path\">Settings › Shortcuts<\/span><\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-x1b\"><span>Mac: turn on iCloud Sync in the Shortcuts app, under <span class=\"cl-path\">Shortcuts › Settings › General<\/span><\/span><\/label><\/li>\n          <\/ul>\n          <div class=\"cl-pair\">\n            <div class=\"cl-card\">\n              <h3>Mac trigger: keyboard shortcut<\/h3>\n              <ul class=\"cl-tasks\">\n                <li><label><input type=\"checkbox\" id=\"cl-x1c\"><span>In the Shortcuts app, double-click your Leads shortcut<\/span><\/label><\/li>\n                <li><label><input type=\"checkbox\" id=\"cl-x1d\"><span>Click the details button (ⓘ)<\/span><\/label><\/li>\n                <li><label><input type=\"checkbox\" id=\"cl-x1e\"><span>Click <strong>Add Keyboard Shortcut<\/strong><\/span><\/label><\/li>\n                <li><label><input type=\"checkbox\" id=\"cl-x1f\"><span>Press a key combination you don’t use elsewhere<\/span><\/label><\/li>\n              <\/ul>\n            <\/div>\n            <div class=\"cl-card\">\n              <h3>Mac trigger: Spotlight<\/h3>\n              <p class=\"cl-muted\">No setup needed. Press <strong>⌘ Space<\/strong>, type your shortcut’s name, and press <strong>Return<\/strong>.<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/details>\n\n      <details class=\"cl-more cl-mac\">\n        <summary><span class=\"cl-plus\" aria-hidden=\"true\"><svg viewBox=\"0 0 16 16\"><path d=\"M8 3v10M3 8h10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg><\/span>Also have an iPhone? Set it up there too<\/summary>\n        <div class=\"cl-more-body\">\n          <p class=\"cl-muted cl-small\">Same shortcut, same lead tracker. Use the same Apple Account on both.<\/p>\n          <ul class=\"cl-tasks\">\n            <li><label><input type=\"checkbox\" id=\"cl-x2a\"><span>Mac: turn on iCloud Sync in the Shortcuts app, under <span class=\"cl-path\">Shortcuts › Settings › General<\/span><\/span><\/label><\/li>\n            <li><label><input type=\"checkbox\" id=\"cl-x2b\"><span>iPhone: turn on iCloud Sync in <span class=\"cl-path\">Settings › Shortcuts<\/span><\/span><\/label><\/li>\n          <\/ul>\n          <div class=\"cl-pair\">\n            <div class=\"cl-card\">\n              <h3>iPhone trigger: Action Button<\/h3>\n              <ul class=\"cl-tasks\">\n                <li><label><input type=\"checkbox\" id=\"cl-x2c\"><span>Open <span class=\"cl-path\">Settings › Action Button<\/span><\/span><\/label><\/li>\n                <li><label><input type=\"checkbox\" id=\"cl-x2d\"><span>Swipe to <strong>Shortcut<\/strong><\/span><\/label><\/li>\n                <li><label><input type=\"checkbox\" id=\"cl-x2e\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n              <\/ul>\n            <\/div>\n            <div class=\"cl-card\">\n              <h3>iPhone trigger: Back Tap<\/h3>\n              <ul class=\"cl-tasks\">\n                <li><label><input type=\"checkbox\" id=\"cl-x2f\"><span>Open <span class=\"cl-path\">Settings › Accessibility › Touch › Back Tap<\/span><\/span><\/label><\/li>\n                <li><label><input type=\"checkbox\" id=\"cl-x2g\"><span>Choose <strong>Double Tap<\/strong> or <strong>Triple Tap<\/strong><\/span><\/label><\/li>\n                <li><label><input type=\"checkbox\" id=\"cl-x2h\"><span>Choose your Leads shortcut<\/span><\/label><\/li>\n              <\/ul>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/details>\n\n    <\/div>\n  <\/section>\n\n  <!-- Step 5 -->\n  <section class=\"cl-step\" id=\"cl-s5\" data-s=\"5\" aria-labelledby=\"cl-h5\">\n    <div class=\"cl-step-head\">\n      <span class=\"cl-num\" aria-hidden=\"true\"><span class=\"cl-i\">5<\/span><svg class=\"cl-k\" viewBox=\"0 0 24 24\"><path d=\"M5.5 12.5l4 4 9-9.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n      <div>\n        <h2 id=\"cl-h5\">Start tracking leads<\/h2>\n        <p class=\"cl-why\">Save your first creator to make sure it all works.<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"cl-step-body\">\n      <ul class=\"cl-tasks\">\n        <li><label><input type=\"checkbox\" id=\"cl-t5a\"><span>Open a creator’s main profile page (not a video or post)<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t5b\"><span>Trigger the shortcut<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t5c\"><span>First time only: choose <strong>Always Allow<\/strong> on each pop-up<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t5d\"><span>Look for “Saved: [name] ([platform])”<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\" id=\"cl-t5e\"><span>Open your lead tracker and find the new row<\/span><\/label><\/li>\n      <\/ul>\n      <p class=\"cl-finish\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10.5\" fill=\"currentColor\"/><path class=\"cl-fk\" d=\"M7 12.4l3.3 3.3L17.2 8.6\" fill=\"none\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span>You’re all set. Every creator you save now lands in your lead tracker.<\/span><\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Messages ===== -->\n  <section aria-labelledby=\"cl-msgs\">\n    <h2 id=\"cl-msgs\">Messages you’ll see<\/h2>\n    <div class=\"cl-panel\">\n      <ul class=\"cl-rows\">\n        <li>\n          <div class=\"cl-msg\">Saved: <em>[name]<\/em> (<em>[platform]<\/em>)<\/div>\n          <div class=\"cl-meaning\">\n            <svg class=\"cl-status ok\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"currentColor\"/><path class=\"cl-g\" d=\"M6 10.3l2.6 2.6L14 7.5\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n            <p>It worked. The creator is in your lead tracker.<\/p>\n          <\/div>\n        <\/li>\n        <li>\n          <div class=\"cl-msg\">Couldn’t read a profile here. Open the creator’s profile page and try again.<\/div>\n          <div class=\"cl-meaning\">\n            <svg class=\"cl-status warn\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"currentColor\"/><path class=\"cl-g\" d=\"M10 5.5v5.5\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle class=\"cl-gd\" cx=\"10\" cy=\"14.2\" r=\"1.15\"/><\/svg>\n            <p>Nothing was saved. Make sure you’re on the creator’s actual profile page, not a video, post, or About page.<\/p>\n          <\/div>\n        <\/li>\n        <li>\n          <div class=\"cl-msg\">Not saved. Your form link may be wrong, or the form isn’t published.<\/div>\n          <div class=\"cl-meaning\">\n            <svg class=\"cl-status bad\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"currentColor\"/><path class=\"cl-g\" d=\"M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>\n            <p>Check that your form is published (Step 1). If it is, delete the shortcut and redo Step 2 with your form’s full URL.<\/p>\n          <\/div>\n        <\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Troubleshooting ===== -->\n  <section aria-labelledby=\"cl-trouble\">\n    <h2 id=\"cl-trouble\">Troubleshooting<\/h2>\n    <div class=\"cl-panel\">\n      <ul class=\"cl-rows\">\n        <li>\n          <span class=\"cl-issue\">Saved, but some details are wrong<\/span>\n          <p>Use the main profile page, with the follower count showing.<\/p>\n        <\/li>\n        <li>\n          <span class=\"cl-issue\">Can’t make a copy of the form<\/span>\n          <p>Sign in to Google, then open the link again.<\/p>\n        <\/li>\n        <li>\n          <span class=\"cl-issue\">No Apple Intelligence in Settings<\/span>\n          <p>Check that your device is supported (see You’ll need) and that your device language and Siri language match.<\/p>\n        <\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Good to know ===== -->\n  <section aria-labelledby=\"cl-know\">\n    <h2 id=\"cl-know\">Good to know<\/h2>\n    <ul class=\"cl-tiles\">\n      <li class=\"cl-tile\" data-s=\"5\">\n        <span class=\"cl-ico2\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z\" fill=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"none\"/><\/svg><\/span>\n        <strong>Reads only the screen<\/strong>\n        <p>AI can misread, so double-check key details.<\/p>\n      <\/li>\n      <li class=\"cl-tile\" data-s=\"1\">\n        <span class=\"cl-ico2\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1\" fill=\"none\"/><path d=\"M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1\" fill=\"none\"/><\/svg><\/span>\n        <strong>Bio links can get cut off<\/strong>\n        <p>Open the Profile Link to see the full bio.<\/p>\n      <\/li>\n      <li class=\"cl-tile\" data-s=\"4\">\n        <span class=\"cl-ico2\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\" fill=\"none\"/><path d=\"M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2\" fill=\"none\"/><\/svg><\/span>\n        <strong>One trigger, one row<\/strong>\n        <p>Triggering twice saves the creator twice.<\/p>\n      <\/li>\n      <li class=\"cl-tile\" data-s=\"3\">\n        <span class=\"cl-ico2\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2\" fill=\"none\"/><path d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\" fill=\"none\"/><\/svg><\/span>\n        <strong>Your data, your sheet<\/strong>\n        <p>The screenshot goes to the AI you picked. The details go to your own form.<\/p>\n      <\/li>\n    <\/ul>\n  <\/section>\n\n  <!-- ===== Lead fields ===== -->\n  <section aria-labelledby=\"cl-cols\">\n    <h2 id=\"cl-cols\">What each lead includes<\/h2>\n    <div class=\"cl-fields\">\n      <div class=\"cl-f\"><span class=\"cl-fl\">Name<\/span><span class=\"cl-fv\">Sample Creator<\/span><\/div>\n      <div class=\"cl-f cl-yours\"><span class=\"cl-fl\">Status<\/span><span class=\"cl-fv\">New<\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Handle<\/span><span class=\"cl-fv\">samplecreator<\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Profile Link<\/span><span class=\"cl-fv\">instagram.com/samplecreator<\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Platform<\/span><span class=\"cl-fv\">Instagram<\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Followers<\/span><span class=\"cl-fv\">48200<\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Category<\/span><span class=\"cl-fv\">Comedy<\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Location<\/span><span class=\"cl-fv\"><span class=\"cl-if\">If shown<\/span><\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Snapchat<\/span><span class=\"cl-fv\"><span class=\"cl-if\">If shown<\/span><\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Email<\/span><span class=\"cl-fv\"><span class=\"cl-if\">If shown<\/span><\/span><\/div>\n      <div class=\"cl-f\"><span class=\"cl-fl\">Bio Links<\/span><span class=\"cl-fv\"><span class=\"cl-if\">If shown<\/span><\/span><\/div>\n      <div class=\"cl-f cl-yours\"><span class=\"cl-fl\">Notes<\/span><span class=\"cl-fv\">Yours to fill in<\/span><\/div>\n    <\/div>\n    <p class=\"cl-muted cl-small\">Example values. Google also adds a Timestamp to each row. Status starts as “New” so you can track your outreach.<\/p>\n  <\/section>\n\n<\/div>\n<\/div>"}, {"v": 14, "name": "Calm teal", "desc": "One teal accent, three Good to know cards", "css": "\n  /* Layout: phone-first single column, all scoped under .cl so it can drop into a Squarespace code block.\n     Calm palette: soft neutrals with one deep-teal accent, used only on step badges, buttons, checkboxes and links. Green / yellow / red appear only where they carry meaning (the messages).\n     No JavaScript: the iPhone/Mac switch and the step check-offs are CSS only. */\n  :host {\n    --cl-bg: #f7f7f5;\n    --cl-surface: #ffffff;\n    --cl-ink: #1b1d1f;\n    --cl-muted: #62676c;\n    --cl-rule: #e6e6e1;\n    --cl-soft: #f0f0ec;\n    --cl-accent: #0f766e;\n    --cl-accent-soft: #e4f1ef;\n    --cl-accent-ink: #0b5f58;\n    --cl-on-accent: #ffffff;\n    --cl-ok: #1f8a4c;\n    --cl-warn: #c58400;\n    --cl-bad: #d1342f;\n  }\n  @media (prefers-color-scheme: dark) {\n    :host(:not([data-theme=\"light\"])) {\n      --cl-bg: #101211;\n      --cl-surface: #181b1a;\n      --cl-ink: #eef0ee;\n      --cl-muted: #a2a8a5;\n      --cl-rule: #2a2e2c;\n      --cl-soft: #222624;\n      --cl-accent: #45c2b1;\n      --cl-accent-soft: #15302c;\n      --cl-accent-ink: #6fd3c5;\n      --cl-on-accent: #0b1211;\n      --cl-ok: #4cc47f;\n      --cl-warn: #f2b53c;\n      --cl-bad: #ff6b61;\n      color-scheme: dark;\n    }\n  }\n  :host([data-theme=\"dark\"]) {\n    --cl-bg: #101211;\n    --cl-surface: #181b1a;\n    --cl-ink: #eef0ee;\n    --cl-muted: #a2a8a5;\n    --cl-rule: #2a2e2c;\n    --cl-soft: #222624;\n    --cl-accent: #45c2b1;\n    --cl-accent-soft: #15302c;\n    --cl-accent-ink: #6fd3c5;\n    --cl-on-accent: #0b1211;\n    --cl-ok: #4cc47f;\n    --cl-warn: #f2b53c;\n    --cl-bad: #ff6b61;\n    color-scheme: dark;\n  }\n  .vh-doc { background: var(--cl-bg); color: var(--cl-ink); }\n  .cl-page { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 2.5rem 5rem; }\n\n  /* ===== Guide (portable) ===== */\n  .cl {\n    --cl-sans: \"Geist\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n    --cl-mono: \"Geist Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n    font-family: var(--cl-sans);\n    font-size: 1rem;\n    line-height: 1.5;\n    color: var(--cl-ink);\n    -webkit-font-smoothing: antialiased;\n    display: grid;\n    gap: 2.5rem;\n  }\n  .cl *, .cl *::before, .cl *::after { box-sizing: border-box; }\n  .cl h1, .cl h2, .cl h3, .cl p, .cl ul, .cl ol, .cl fieldset, .cl legend { margin: 0; padding: 0; border: 0; }\n  .cl h1, .cl h2, .cl h3 { font-family: var(--cl-sans); color: var(--cl-ink); text-transform: none; }\n  .cl ul, .cl ol { list-style: none; }\n  .cl p, .cl li { font-size: inherit; line-height: inherit; }\n  .cl section, .cl header { display: grid; gap: 1rem; min-width: 0; }\n  .cl a { color: var(--cl-accent-ink); font-weight: 600; text-underline-offset: 0.2em; text-decoration-thickness: 1.5px; }\n  .cl a:focus-visible, .cl summary:focus-visible { outline: 3px solid var(--cl-accent); outline-offset: 3px; border-radius: 8px; }\n  .cl strong, .cl .cl-path { font-weight: 600; }\n  .cl .cl-muted { color: var(--cl-muted); }\n  .cl .cl-small { font-size: 0.9rem; }\n  .cl svg { display: block; }\n\n  .cl h1 { font-size: clamp(2.2rem, 8vw, 3rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; text-wrap: balance; }\n  .cl h2 { font-size: 1.3rem; font-weight: 650; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }\n  .cl h3 { font-size: 0.98rem; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }\n  .cl .cl-intro { font-size: 1.1rem; line-height: 1.5; max-width: 40rem; }\n\n  /* ---------- Hero flow ---------- */\n  .cl .cl-flow {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 0.75rem;\n    position: relative;\n    margin-top: 0.75rem;\n  }\n  .cl .cl-flow::before {\n    content: \"\";\n    position: absolute;\n    top: 1.5rem;\n    left: 12.5%;\n    right: 12.5%;\n    border-top: 1.5px dashed var(--cl-rule);\n  }\n  .cl .cl-flow li { display: grid; gap: 0.2rem; justify-items: center; text-align: center; min-width: 0; }\n  .cl .cl-ico {\n    position: relative;\n    width: 3rem;\n    height: 3rem;\n    border-radius: 16px;\n    display: grid;\n    place-items: center;\n    background: var(--cl-surface);\n    border: 1px solid var(--cl-rule);\n    color: var(--cl-accent-ink);\n    margin-bottom: 0.45rem;\n  }\n  .cl .cl-flow li:last-child .cl-ico { background: var(--cl-accent); border-color: var(--cl-accent); color: var(--cl-on-accent); }\n  .cl .cl-ico svg { width: 1.4rem; height: 1.4rem; }\n  .cl .cl-flow strong { font-size: 0.92rem; line-height: 1.25; }\n  .cl .cl-flow .cl-d { font-size: 0.82rem; color: var(--cl-muted); line-height: 1.35; }\n  @media (max-width: 600px) {\n    .cl .cl-flow { grid-template-columns: 1fr; gap: 0.85rem; }\n    .cl .cl-flow::before { top: 1.5rem; bottom: 1.5rem; left: 1.5rem; right: auto; border-top: 0; border-left: 1.5px dashed var(--cl-rule); }\n    .cl .cl-flow li { grid-template-columns: 3rem 1fr; column-gap: 0.9rem
